<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 2 - Bootstrap</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="CSS/teste.css">
</head>

<body class="bg-dark">

    <div class="container-fluid p-3">

        <div class="row g-3" style="min-height:100vh;">

            <!-- Menu lateral -->
            <div class="col-2">
                <div class="bg-success rounded h-100"></div>
            </div>

            <!-- Conteúdo -->
            <div class="col-10">

                <!-- Topo -->
                <div class="row g-3 mb-3">
                    <div class="col-12">
                        <div class="bg-warning rounded" style="height:80px;"></div>
                    </div>
                </div>

                <!-- Banner -->
                <div class="row g-3 mb-3">
                    <div class="col-12">
                        <div class="bg-info rounded" style="height:300px;"></div>
                    </div>
                </div>

                <!-- Cards -->
                <div class="row g-3 mb-3">
                    <div class="col-3">
                        <div class="bg-danger rounded" style="height:220px;"></div>
                    </div>

                    <div class="col-3">
                        <div class="bg-danger rounded" style="height:220px;"></div>
                    </div>

                    <div class="col-3">
                        <div class="bg-danger rounded" style="height:220px;"></div>
                    </div>

                    <div class="col-3">
                        <div class="bg-danger rounded" style="height:220px;"></div>
                    </div>
                </div>

                <!-- Rodapé -->
                <div class="row">
                    <div class="col-12">
                        <div class="bg-secondary rounded" style="height:80px;"></div>
                    </div>
                </div>

            </div>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
