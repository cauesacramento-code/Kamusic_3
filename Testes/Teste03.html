<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste 02 - KaMusic</title>
    <link rel="stylesheet" href="Teste03.css">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <!-- FontAwesome (Necessário para os ícones fa-moon / fa-sun funcionarem) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="menu">
        <div class="menu-logo">
            <img src="../IMG/WhiteLogo.png">
        </div>
        <div class="menu-paginas">
            <div id="home" class="itens">
                <div class="i"><i class="bi bi-house-door-fill"></i></div>Home
            </div>
            <div id="artistasmus" class="itens">
                <div class="i"><i class="bi bi-compass-fill"></i></div>Artistas e músicas
            </div>
            <div id="estilosmus" class="itens">
                <div class="i"><i class="bi bi-graph-up"></i></div>Estilos musicais
            </div>
            <div id="sobrenos" class="itens">
                <div class="i"><i class="bi bi-clipboard-fill"></i></div>Sobre Nós
            </div>
        </div>
    </div>
    
    <div class="content container-fluid p-3">

        <!-- Conteúdo -->
        <div class="col-12 col-md-12 d-flex flex-column gap-3">

            <!-- Topo (Modificado para conter o botão alinhado à direita) -->
            <div class="bg-warning rounded d-flex align-items-center justify-content-end px-3" style="height: 8vh;">
                <button class="action-btn btn btn-dark btn-sm" id="themeToggle" title="Alternar Modo Escuro/Claro">
                    <i class="fa-solid fa-moon" id="themeIcon"></i>
                </button>
            </div>

            <!-- Banner -->
            <div class="bg-info rounded" style="height: 40vh;"></div>

            <!-- Cards -->
            <div class="row g-3">
                <div class="col-12 col-sm-6 col-lg-3">
                    <div class="bg-danger rounded" style="height: 30vh;"></div>
                </div>
                <div class="col-12 col-sm-6 col-lg-3">
                    <div class="bg-danger rounded" style="height: 30vh;"></div>
                </div>
                <div class="col-12 col-sm-6 col-lg-3">
                    <div class="bg-danger rounded" style="height: 30vh;"></div>
                </div>
                <div class="col-12 col-sm-6 col-lg-3">
                    <div class="bg-danger rounded" style="height: 30vh;"></div>
                </div>
            </div>

            <!-- Rodapé -->
            <div class="bg-secondary rounded" style="height: auto; min-height: 100px;"></div>

        </div>

    </div>

    <!-- JAVASCRIPT DE NAVEGAÇÃO E TEMA -->
    <script>
        // --- 1. EXPLICAÇÃO DO MODO CLARO / ESCURO ---
        const themeToggle = document.getElementById('themeToggle');
        const themeIcon = document.getElementById('themeIcon');
        
        themeToggle.addEventListener('click', () => {
            // Alterna a classe 'light-theme' no elemento raiz <body>
            document.body.classList.toggle('light-theme');
            
            // Troca o ícone do botão (Lua <-> Sol) dependendo se a classe está ativa
            if(document.body.classList.contains('light-theme')) {
                themeIcon.classList.replace('fa-moon', 'fa-sun');
            } else {
                themeIcon.classList.replace('fa-sun', 'fa-moon');
            }
        });
    </script>
</body>

</html>
