<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 2 - Bootstrap</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-dark">

    <div class="container-fluid p-3 vh-100">

        <div class="row h-100 g-3">

            <!-- Menu -->
            <div class="col-12 col-md-2">

            </div>

            <!-- Conteúdo -->
            <div class="col-12 col-md-10 d-flex flex-column gap-3">

                <!-- Topo -->

                <!-- Banner -->

                <!-- Cards -->
                <div class="row g-3">

                    <div class="col-12 col-sm-6 col-lg-3">
                        <div class="bg-danger rounded" style="height: 30vh;"></div>
                    </div>

                    <div class="col-12 col-sm-6 col-lg-3">

                    </div>

                    <div class="col-12 col-sm-6 col-lg-3">
                        <div class="bg-danger rounded" style="height: 30vh;"></div>
                    </div>

                    <div class="col-12 col-sm-6 col-lg-3">
                        <div class="bg-danger rounded" style="height: 30vh;"></div>
                    </div>

                </div>

                <!-- Rodapé -->
                <div class="bg-secondary rounded" style="height: 10vh;"></div>

            </div>

        </div>

    </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</html>
