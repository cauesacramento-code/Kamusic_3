<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste 02 - KaMusic</title>
    <link rel="stylesheet" href="Teste02.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <!-- GATILHO COMPLETO AQUI -->
    <input type="checkbox" id="btn-menu" class="gatilho">
    <label for="btn-menu" class="menu-hamburguer">
        <i class="bi bi-list"></i>
    </label>

    <div class="menu">
        <div class="menu-logo">
            <img src="../IMG/LogoK.png">
        </div>
        <div class="menu-paginas">
            <div id="home" class="itens">
                <div class="i"><i class="bi bi-house-door-fill"></i></div>Home
            </div>
            <div id="artistasmus" class="itens">
                <div class="i"><i class="bi bi-compass-fill"></i></div>Artistas e músicas
            </div>
            <div id="estilosmus" class="itens">
                <div class="i"><i class="bi bi-graph-up"></i></div>Estilos musicais
            </div>
            <div id="sobrenos" class="itens">
                <div class="i"><i class="bi bi-clipboard-fill"></i></div>Sobre Nós
            </div>
        </div>
    </div>
    <div class="content container-fluid p-3">

        <!-- Conteúdo -->
        <div class="col-12 col-md-12 d-flex flex-column gap-3">

            <!-- Topo -->
            <div class="cor rounded d-flex align-items-center justify-content-end px-3" style="height: 8vh;" id="topo">

                <p id="Email" class="bs-light"></p>

                <div class="search-bar justify-content-left bs-light"> <i class="fa-solid fa-search"></i> <input type="text" id="searchInput" placeholder="Pesquise músicas, álbuns ou artistas..."> </div>

                <button class="action-btn btn btn-light btn-sm me-3" id="themeToggle"
                    title="Alternar Modo Escuro/Claro">
                    <i class="fa-solid fa-moon" id="themeIcon"></i>
                </button>

                <button class="action-btn btn btn-light btn-sm me-3" id="Login" title="Sistema de login">
                    <i class="fa fa-user-circle"></i>
                </button>

                <!--Sistema de login-->

                <div class="cs gap-10" id="loginconteiner">
                    <form>
                        <div class="form-group">
                            <label for="exampleInputEmail1" class="text-dark">Email address</label>
                            <input type="email" id="email" class="form-control bs-primary" id="exampleInputEmail1"
                                aria-describedby="emailHelp">
                            <small id="emailHelp" class="form-text">Nós nunca compartilharemos seu e-mail com ninguém.
                                else.</small>
                        </div>
                        <div class="form-group">
                            <label for="exampleInputPassword1" class="text-dark">Senha</label>
                            <input type="password" class="form-control" id="exampleInputPassword1">
                        </div>
                        <div class="form-group form-check">
                            <input type="checkbox" class="form-check-input" id="exampleCheck1">
                            <label class="form-check-label text-dark" for="exampleCheck1">Lembre-me</label>
                        </div>
                        <button type="submit" class="btn btn-primary">Confirmar</button>
                    </form>
                </div>

            </div>

            <!-- Banner -->
            <div class="cor-gradient rounded" style="height: 50vh;"></div>

            <!-- Cards -->

            <div class="row g-4">

                <div class="col-12 col-sm-6 col-lg-3">
                    <div class="cor card-simples">
                        <i class="fa-solid fa-robot icone"></i>
                        <h3>Cyberpunk Odyssey</h3>
                        <p>Neon Runners</p>
                    </div>
                </div>

                <div class="col-12 col-sm-6 col-lg-3">
                    <div class="cor card-simples">
                        <i class="fa-solid fa-cloud-moon icone"></i>
                        <h3>Midnight Sunset</h3>
                        <p>Aura</p>
                    </div>
                </div>

                <div class="col-12 col-sm-6 col-lg-3">
                    <div class="cor card-simples">
                        <i class="fa-solid fa-bolt icone"></i>
                        <h3>Electric Pulse</h3>
                        <p>Synthetica</p>
                    </div>
                </div>

                <div class="col-12 col-sm-6 col-lg-3">
                    <div class="cor card-simples">
                        <i class="fa-solid fa-mug-hot icone"></i>
                        <h3>Coffee & Rain</h3>
                        <p>Lo-Fi Generator</p>
                    </div>
                </div>

                <!-- Rodapé -->
                <div class="cor rounded" style="height: auto; min-height: 100px;"></div>

            </div>
        </div>

        <!-- JAVASCRIPT DE NAVEGAÇÃO E TEMA -->
        <script>

            const themeToggle = document.getElementById('themeToggle');
            const themeIcon = document.getElementById('themeIcon');

            // 1. ASSIM QUE A PÁGINA CARREGA: Verifica se existe um tema salvo no computador
            const temaSalvo = localStorage.getItem('temaPreferido');

            if (temaSalvo === 'claro') {
                document.body.classList.add('light-theme');
                themeIcon.classList.replace('fa-moon', 'fa-sun');
            } else {
                // Se não tiver nada salvo ou estiver como 'escuro', garante o padrão escuro
                document.body.classList.remove('light-theme');
                themeIcon.classList.replace('fa-sun', 'fa-moon');
            }

            // 2. AO CLICAR NO BOTÃO: Alterna o tema e salva a nova escolha
            themeToggle.addEventListener('click', () => {
                // Alterna a classe no <body>
                document.body.classList.toggle('light-theme');

                // Troca o ícone e grava a informação no localStorage baseado na mudança
                if (document.body.classList.contains('light-theme')) {
                    themeIcon.classList.replace('fa-moon', 'fa-sun');
                    localStorage.setItem('temaPreferido', 'claro'); // Salva "claro" no PC
                } else {
                    themeIcon.classList.replace('fa-sun', 'fa-moon');
                    localStorage.setItem('temaPreferido', 'escuro'); // Salva "escuro" no PC
                }
            }); const botaoLogin = document.getElementById('Login');
            const painelLogin = document.getElementById('loginconteiner');

            // 1. Abre e fecha ao clicar no botão de usuário
            botaoLogin.addEventListener('click', function (event) {
                event.stopPropagation();
                painelLogin.classList.toggle('gatilho');

                // Atualiza o body logo após abrir/fechar o painel
                if (painelLogin.classList.contains('gatilho')) {
                    document.body.classList.add('dontouch');
                } else {
                    document.body.classList.remove('dontouch');
                }
            });

            // 2. Evita que o painel feche se o usuário clicar dentro do formulário
            painelLogin.addEventListener('click', function (event) {
                event.stopPropagation();
            });

            // 3. Fecha o painel se o usuário clicar em qualquer outro lugar da tela
            document.addEventListener('click', function () {
                painelLogin.classList.remove('gatilho');

                // Como o painel fechou, remove obrigatoriamente a classe dontouch do body
                document.body.classList.remove('dontouch');
            });

        </script>
</body>

</html>
