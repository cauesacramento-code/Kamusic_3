<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Home - KaMusic</title>

    <link rel="stylesheet" href="CSS/KamusicIndex.css">

    <link rel="shortcut icon" href="IMG/LogoKaBIcon.png">

    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>

    <!-- ==================== MENU MOBILE ==================== -->

    <input type="checkbox" id="btn-menu" class="gatilho">

    <label for="btn-menu" class="menu-hamburguer">
        <i class="bi bi-list"></i>
    </label>


    <!-- ==================== MENU ==================== -->

    <div class="menu">

        <div class="menu-logo">
            <img src="./IMG/LogoKA1.png">
        </div>

        <div class="menu-paginas">

            <a href="index.html">
                <div id="home" class="itens">
                    <div class="i">
                        <i class="bi bi-house-door-fill"></i>
                    </div>
                    Home
                </div>
            </a>

            <a href="KamusicArtistas.html">
                <div id="artistasmus" class="itens">
                    <div class="i">
                        <i class="bi bi-compass-fill"></i>
                    </div>
                    Artistas e músicas
                </div>
            </a>

            <a href="KamusicGeneros.html">
                <div id="estilosmus" class="itens">
                    <div class="i">
                        <i class="bi bi-graph-up"></i>
                    </div>
                    Estilos musicais
                </div>
            </a>

            <a href="KamusicSobrenos.html">
                <div id="sobrenos" class="itens">
                    <div class="i">
                        <i class="bi bi-clipboard-fill"></i>
                    </div>
                    Sobre Nós
                </div>
            </a>

        </div>
    </div>


    <!-- ==================== CONTEÚDO ==================== -->

    <div class="content container-fluid p-3">

        <div class="col-12 d-flex flex-column gap-3">


            <!-- ==================== TOPO ==================== -->

            <div class="cor rounded d-flex align-items-center justify-content-end px-3"
                id="topo"
                style="height: 8vh;">

                <p id="Email"></p>


                <!-- PESQUISA -->

                <div class="search-bar">

                    <i class="fa-solid fa-search"></i>

                    <input type="text"
                        id="searchInput"
                        placeholder="Pesquise músicas, álbuns ou artistas...">

                </div>


                <!-- BOTÃO TEMA -->

                <button class="action-btn btn btn-light btn-sm me-3"
                    id="themeToggle"
                    title="Alternar Modo Escuro/Claro">

                    <i class="fa-solid fa-moon" id="themeIcon"></i>

                </button>


                <!-- ==================== LOGIN ==================== -->

                <button type="button"
                    class="action-btn btn btn-light btn-sm me-3"
                    id="Login"
                    data-bs-toggle="modal"
                    data-bs-target="#staticBackdrop">

                    <i class="fa fa-user-circle"></i>

                </button>


                <!-- MODAL DE LOGIN -->

                <div class="modal fade"
                    id="staticBackdrop"
                    data-bs-backdrop="static"
                    data-bs-keyboard="false"
                    tabindex="-1"
                    aria-labelledby="staticBackdropLabel"
                    aria-hidden="true">

                    <div class="modal-dialog modal-dialog-centered">

                        <div class="modal-content p-4">

                            <h1 class="modal-header fs-5">
                                Login
                            </h1>


                            <form id="loginForm">

                                <div class="p-3">

                                    <!-- EMAIL -->

                                    <div class="form-group mb-3">

                                        <label for="email"
                                            class="text-dark">
                                            Endereço de Email
                                        </label>

                                        <input type="email"
                                            id="email"
                                            class="form-control"
                                            required>

                                        <small class="form-text">
                                            Nós nunca compartilharemos seu
                                            e-mail com alguém.
                                        </small>

                                    </div>


                                    <!-- SENHA -->

                                    <div class="form-group mb-3">

                                        <label for="exampleInputPassword1"
                                            class="text-dark">
                                            Senha
                                        </label>

                                        <input type="password"
                                            class="form-control"
                                            id="exampleInputPassword1"
                                            required>

                                    </div>


                                    <!-- LEMBRE-ME -->

                                    <div class="form-group form-check mb-3">

                                        <input type="checkbox"
                                            class="form-check-input"
                                            id="exampleCheck1">

                                        <label class="form-check-label text-dark"
                                            for="exampleCheck1">
                                            Lembre-me
                                        </label>

                                    </div>

                                </div>


                                <!-- BOTÕES -->

                                <div class="modal-footer">

                                    <button type="submit"
                                        class="btn btn-primary">
                                        Confirmar
                                    </button>

                                    <button type="button"
                                        class="btn btn-secondary"
                                        data-bs-dismiss="modal">
                                        Fechar
                                    </button>

                                </div>

                            </form>

                        </div>

                    </div>

                </div>

            </div>


            <!-- ==================== BANNER ==================== -->

            <div class="cor-gradient rounded"
                style="height: 50vh;">
            </div>


            <!-- ==================== CARDS ==================== -->

            <div class="row g-4">

                <div class="col-12 col-sm-6 col-lg-3">

                    <div class="cor card-simples">

                        <i class="fa-solid fa-robot icone"></i>

                        <h3>Cyberpunk Odyssey</h3>

                        <p>Neon Runners</p>

                    </div>

                </div>


                <div class="col-12 col-sm-6 col-lg-3">

                    <div class="cor card-simples">

                        <i class="fa-solid fa-cloud-moon icone"></i>

                        <h3>Midnight Sunset</h3>

                        <p>Aura</p>

                    </div>

                </div>


                <div class="col-12 col-sm-6 col-lg-3">

                    <div class="cor card-simples">

                        <i class="fa-solid fa-bolt icone"></i>

                        <h3>Electric Pulse</h3>

                        <p>Synthetica</p>

                    </div>

                </div>


                <div class="col-12 col-sm-6 col-lg-3">

                    <div class="cor card-simples">

                        <i class="fa-solid fa-mug-hot icone"></i>

                        <h3>Coffee & Rain</h3>

                        <p>Lo-Fi Generator</p>

                    </div>

                </div>

            </div>


            <!-- RODAPÉ -->

            <div class="cor rounded"
                style="min-height: 100px;">
            </div>

        </div>

    </div>


    <!-- ==================== BOOTSTRAP ==================== -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
    </script>


    <!-- ==================== JAVASCRIPT ==================== -->

    <script>

        // ==================== TEMA ====================

        const themeToggle = document.getElementById('themeToggle');
        const themeIcon = document.getElementById('themeIcon');

        const temaSalvo = localStorage.getItem('temaPreferido');

        if (temaSalvo === 'claro') {

            document.body.classList.add('light-theme');

            themeIcon.classList.replace(
                'fa-moon',
                'fa-sun'
            );

        }


        themeToggle.addEventListener('click', () => {

            document.body.classList.toggle('light-theme');

            if (document.body.classList.contains('light-theme')) {

                themeIcon.classList.replace(
                    'fa-moon',
                    'fa-sun'
                );

                localStorage.setItem(
                    'temaPreferido',
                    'claro'
                );

            } else {

                themeIcon.classList.replace(
                    'fa-sun',
                    'fa-moon'
                );

                localStorage.setItem(
                    'temaPreferido',
                    'escuro'
                );

            }

        });


        // ==================== LOGIN ====================

        const formulario = document.querySelector('#loginForm');

        const modalElement =
            document.getElementById('staticBackdrop');


        // Recupera o e-mail salvo

        const emailSalvo =
            localStorage.getItem('emailSalvo');

        const lembremeSalvo =
            localStorage.getItem('lembreme');


        if (
            emailSalvo &&
            lembremeSalvo === 'true'
        ) {

            document.getElementById('email').value =
                emailSalvo;

            document.getElementById('exampleCheck1').checked =
                true;

        }


        // Quando confirmar o login

        formulario.addEventListener('submit', function (event) {

            event.preventDefault();

            const email =
                document.getElementById('email').value;

            const lembreme =
                document.getElementById('exampleCheck1').checked;


            // Se marcou "Lembre-me"

            if (lembreme) {

                localStorage.setItem(
                    'emailSalvo',
                    email
                );

                localStorage.setItem(
                    'lembreme',
                    'true'
                );

            } else {

                localStorage.removeItem(
                    'emailSalvo'
                );

                localStorage.removeItem(
                    'lembreme'
                );

            }


            // Remove o foco do botão

            document.activeElement.blur();


            // Fecha o modal

            const modal =
                bootstrap.Modal.getInstance(
                    modalElement
                );

            modal.hide();

        });

    </script>

</body>

</html>
